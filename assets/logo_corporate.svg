<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Corporate Canvas Gradient -->
    <radialGradient id="corp-bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="55%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Electric Cyan to Royal Sapphire Gradient -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044ee"/>
    </linearGradient>

    <!-- Dynamic J-Sweep Violet Gradient -->
    <linearGradient id="violet-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtle Edge Highlight -->
    <linearGradient id="edge-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- High-End Bloom Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Premium Squircle App Tile -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#corp-bg)" stroke="#1e293b" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="110" fill="none" stroke="url(#cyan-blue)" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Subtle Precision Geometric Grid / Radar Lines -->
  <circle cx="256" cy="226" r="130" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="256" cy="226" r="80" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
  <line x1="256" y1="96" x2="256" y2="356" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
  <line x1="126" y1="226" x2="386" y2="226" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>

  <!-- ======================================================== -->
  <!-- CORPORATE SYMBOL: INTERLOCKING "H" & "J" CYBER-SHIELD     -->
  <!-- ======================================================== -->
  <g filter="url(#soft-glow)">
    
    <!-- LEFT PILLAR (The 'H' Left Anchor) -->
    <!-- Sharp beveled top, descending into clean vertical geometry -->
    <path d="M 166 140 
             L 204 116 
             L 204 316 
             L 166 292 
             Z" 
          fill="url(#cyan-blue)"/>
    
    <!-- INNER ANGLED BRIDGE (Connecting H to J) -->
    <!-- Dynamic high-velocity data chevron -->
    <path d="M 204 198 
             L 256 168 
             L 256 214 
             L 204 244 
             Z" 
          fill="url(#cyan-blue)" 
          opacity="0.9"/>

    <path d="M 256 168 
             L 308 198 
             L 308 244 
             L 256 214 
             Z" 
          fill="url(#violet-blue)" 
          opacity="0.95"/>

    <!-- RIGHT PILLAR & J-ANCHOR (The 'J' Dynamic Sweep) -->
    <!-- Starts at H's right upright, flows down and sweeps in an elegant shield curve -->
    <path d="M 308 116 
             L 346 140 
             L 346 270 
             C 346 324, 308 356, 256 356 
             C 214 356, 186 334, 180 304 
             L 216 294 
             C 220 308, 234 320, 256 320 
             C 284 320, 308 302, 308 270 
             Z" 
          fill="url(#violet-blue)"/>

    <!-- KERNEL COMPASS STAR / CRYPTO CORE (Center Emblem) -->
    <polygon points="256,192 262,204 274,210 262,216 256,228 250,216 238,210 250,204" 
             fill="#ffffff" 
             opacity="0.95"/>
    <circle cx="256" cy="210" r="3" fill="#00f5ff"/>

  </g>

  <!-- Precision Reflection Chamfer on Top Edges -->
  <path d="M 166 140 L 204 116 L 256 168 L 308 116 L 346 140" 
        fill="none" 
        stroke="url(#edge-highlight)" 
        stroke-width="2" 
        stroke-linecap="round"/>

  <!-- ======================================================== -->
  <!-- CORPORATE TYPOGRAPHY                                     -->
  <!-- ======================================================== -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#f8fafc">
    HIDING<tspan fill="#00f5ff">JACKSON</tspan>
  </text>
  
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#64748b">
    ENTERPRISE STEALTH PRIVACY
  </text>
</svg>
