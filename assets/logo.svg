<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <!-- Neon Violet Gradient -->
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#cyan-glow)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital Cyber Compass / Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Radar Cardinal Ticks -->
  <line x1="256" y1="46" x2="256" y2="76" stroke="#00f5ff" stroke-width="3" opacity="0.8"/>
  <line x1="256" y1="436" x2="256" y2="466" stroke="#00f5ff" stroke-width="3" opacity="0.4"/>
  <line x1="46" y1="256" x2="76" y2="256" stroke="#00f5ff" stroke-width="3" opacity="0.4"/>
  <line x1="436" y1="256" x2="466" y2="256" stroke="#00f5ff" stroke-width="3" opacity="0.8"/>

  <!-- Crossed Cyber-Cutlasses (Pirate Heritage) -->
  <g opacity="0.35">
    <path d="M120 380 L380 120" stroke="url(#violet-glow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 380 L120 120" stroke="url(#violet-glow)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Central Stealth Pirate Captain Skull / Mask -->
  <!-- Tricorne Hat Crest -->
  <path d="M110 200 C160 110, 352 110, 402 200 C370 175, 330 160, 256 160 C182 160, 142 175, 110 200 Z" 
        fill="#0f172a" stroke="url(#cyan-glow)" stroke-width="3.5" filter="url(#neon-blur)"/>
  
  <!-- Hat Brim Accent Line -->
  <path d="M100 205 Q256 145 412 205" fill="none" stroke="url(#cyan-glow)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="155" r="7" fill="url(#gold-grad)"/>

  <!-- Cyber Bandana / Visor Shield -->
  <path d="M148 208 L364 208 L350 256 L162 256 Z" fill="url(#violet-glow)" opacity="0.85"/>
  <line x1="154" y1="232" x2="358" y2="232" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- Skull Jaw & Cheekbones -->
  <path d="M165 256 C165 310, 190 350, 215 365 L215 385 C215 392, 222 398, 230 398 L282 398 C290 398, 297 392, 297 385 L297 365 C322 350, 347 310, 347 256 Z" 
        fill="#090d16" stroke="#334155" stroke-width="3"/>

  <!-- Cyber Eye-Patch (Right Eye) -->
  <path d="M185 272 Q215 260 235 285 Q215 310 185 298 Z" fill="#030712" stroke="url(#cyan-glow)" stroke-width="2"/>
  <line x1="160" y1="240" x2="245" y2="305" stroke="url(#cyan-glow)" stroke-width="2.5"/>

  <!-- Glowing HUD Sensor Eye (Left Eye - Cyber Eye) -->
  <circle cx="295" cy="285" r="18" fill="#040814" stroke="url(#cyan-glow)" stroke-width="2.5"/>
  <circle cx="295" cy="285" r="9" fill="#00f5ff" filter="url(#neon-blur)"/>
  <circle cx="295" cy="285" r="4" fill="#ffffff"/>
  <circle cx="295" cy="285" r="26" fill="none" stroke="#00f5ff" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>

  <!-- Teeth / Grille Circuit -->
  <path d="M225 365 L287 365" stroke="url(#cyan-glow)" stroke-width="2"/>
  <line x1="237" y1="358" x2="237" y2="372" stroke="url(#cyan-glow)" stroke-width="1.5"/>
  <line x1="249" y1="358" x2="249" y2="372" stroke="url(#cyan-glow)" stroke-width="1.5"/>
  <line x1="263" y1="358" x2="263" y2="372" stroke="url(#cyan-glow)" stroke-width="1.5"/>
  <line x1="275" y1="358" x2="275" y2="372" stroke="url(#cyan-glow)" stroke-width="1.5"/>

  <!-- Brand Typography -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#ffffff">
    HIDING<tspan fill="#00f5ff">JACKSON</tspan>
  </text>
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#64748b">
    SOVEREIGN STEALTH ENGINE
  </text>
</svg>
