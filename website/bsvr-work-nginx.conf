# ==============================================================================
# NGINX PRODUCTION CONFIGURATION FOR BSVR.WORK/HIDINGJACKSON
# Domain: https://www.bsvr.work/hidingjackson or https://bsvr.work/hidingjackson
# Architect: Sai Vardhan Reddy (BSVR Technologies)
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.bsvr.work bsvr.work;
    return 301 https://$host$request_uri;
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bsvr.work bsvr.work;

    # SSL Certificates (e.g., Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/bsvr.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsvr.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Company Root (Main bsvr.work website)
    location / {
        root /var/www/bsvr-main;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # HidingJackson Portal & Documentation: /hidingjackson
    # --------------------------------------------------------------------------
    location /hidingjackson {
        alias /var/www/hidingjackson/website;
        index index.html;
        try_files $uri $uri/ /hidingjackson/index.html;

        # Performance & Compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml text/yaml;

        # Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --------------------------------------------------------------------------
    # Live Zero-Error Proxy Subscription Feed
    # URL: https://www.bsvr.work/hidingjackson/profiles/hidingjackson-global.yaml
    # --------------------------------------------------------------------------
    location /hidingjackson/profiles/ {
        alias /var/www/hidingjackson/website/profiles/;
        default_type text/yaml;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # Direct Installer Download (Alternative to GitHub Releases)
    # URL: https://www.bsvr.work/hidingjackson/download/HidingJackson-v1.1.0-Setup.exe
    # --------------------------------------------------------------------------
    location /hidingjackson/download/ {
        alias /var/www/hidingjackson/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
    }
}
